<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive album of temples from around the world.">
    <meta name="author" content="Alex Ochieng Oyweka">
    <title>Temples of the World</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <div class="site-title">Temple Album</div>

        <button id="menu" aria-label="Open navigation menu"></button>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Temple Album</h1>

        <div class="temple-grid">
            <figure>
                <img src="images/aba-nigeria.jpg" alt="Aba Nigeria Temple">
                <figcaption>Aba Nigeria Temple</figcaption>
            </figure>

            <figure>
                <img src="images/abidjan-ivory.jpg" alt="Abidjan Ivory Coast Temple">
                <figcaption>Abidjan Ivory Coast Temple</figcaption>
            </figure>

            <figure>
                <img src="images/accra-ghana.jpg" alt="Accra Ghana Temple">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img src="images/barcelona-spain.jpg" alt="Barcelona Spain Temple">
                <figcaption>Barcelona Spain Temple</figcaption>
            </figure>

            <figure>
                <img src="images/layton-utah.jpg" alt="Layton Utah Temple">
                <figcaption>Layton Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="images/lima-peru.jpg" alt="Lima Peru Temple">
                <figcaption>Lima Peru Temple</figcaption>
            </figure>

            <figure>
                <img src="images/madrid-spain.jpg" alt="Madrid Spain Temple">
                <figcaption>Madrid Spain Temple</figcaption>
            </figure>

            <figure>
                <img src="images/manaus-brazil.jpg" alt="Manaus Brazil Temple">
                <figcaption>Manaus Brazil Temple</figcaption>
            </figure>

            <figure>
                <img src="images/nairobi-kenya.jpg" alt="Nairobi Kenya Temple">
                <figcaption>Nairobi Kenya Temple</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Alex Ochieng Oyweka, Kenya</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
